# Tool configuration, plus the uv-managed deployment environment.
#
# Research and training live in pixi.toml: that environment is pinned around a
# CUDA PyTorch build and is not something a deployment box needs. The work of
# turning a trained checkpoint into something an Intel NPU runs -- quantization,
# OpenVINO conversion, accuracy verification -- is a separate concern with a
# separate dependency set, so it gets a separate, lockable environment here
# rather than being bolted onto the training one.
#
#   uv sync --group deploy    # quantization + OpenVINO, CUDA torch for QAT
#   uv sync --group inc       # Intel Neural Compressor, evaluated separately
#
# ruff, pytest and ty read their rules from the same file either way, so the
# two environments cannot drift on style or test configuration.

[project]
name = "frappe"
version = "0.1.0"
description = "FRAPPE: Full-Input Residual-Output Autoencoding with Projection Pursuit Encoders"
requires-python = "==3.12.*"

[tool.uv]
# The repository is run from a checkout, not installed; PYTHONPATH=. is how both
# environments already reach `src` and `tools`.
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
# Everything needed to quantize an encoder and prove the result still codes the
# same bitstream: NNCF for the quantizers, OpenVINO for the target runtime,
# onnxruntime for the reference graph, pillow-jpls for the real entropy coder,
# and CUDA torch because quantization-aware fine-tuning is a training loop.
deploy = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "numpy",
    "pillow",
    "pillow-jpls",
    "openvino",
    "nncf",
    "onnx",
    "onnxruntime-gpu",
    # onnxruntime-gpu 1.29 links CUDA 13, unlike torch's cu128 wheels, so the
    # CUDA 13 userland lives beside torch's as pip packages; the hybrid runtime
    # preloads it by absolute path (see docs/NPU_INT8_ENCODER_CUDA_DECODER.md).
    # cuDNN stays at torch's 9.19 (cu12): the soname libcudnn.so.9 is shared.
    "nvidia-cublas>=13",
    "nvidia-cuda-runtime>=13",
    "onnxsim",
    "onnxscript",
    # NNCF's deployment strip (fake quantizers into native Q/DQ) builds on it.
    "torchao",
    "beartype",
    "jaxtyping",
    "pytest",
    # The QAT loop records its own runs the same way the training one does.
    "tensorboard",
    # The codec package itself: model.py reaches for these at import time, and a
    # quantizer that cannot construct the model has nothing to quantize.
    "einops",
    "livecodec",
    "timm",
]
# Intel Neural Compressor is kept in its own group: it carries a transformers
# and accelerate dependency chain that has nothing to do with an image codec,
# and its PyTorch QAT covers a different scheme space than this model needs.
inc = ["neural-compressor"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".pixi", "FRAPPE.ipynb"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes: undefined names, unused imports - real defects
    "E", "W",  # pycodestyle
    "I",    # import ordering
    "UP",   # pyupgrade
    "B",    # bugbear: loop-variable capture, mutable defaults
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",
    "PL",   # pylint subset
    "TRY",  # exception hygiene
    "PTH",  # pathlib over os.path
    "ARG",  # unused arguments
]
ignore = [
    # The vendored quantizer and companding code uses the paper's own Greek
    # names for its parameters, which is worth more than ASCII identifiers.
    "PLC2401",
    # Long messages inside raise statements read better inline than hoisted
    # into a variable.
    "TRY003", "EM101", "EM102",
    # Magic values are the substance of a codec: 127 is the int8 range and 24 is
    # uncompressed RGB, and naming every one of them hides more than it reveals.
    "PLR2004",
    # A tool's main() legitimately takes many arguments and branches.
    "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # Heavy optional dependencies - pillow_jpls, onnx, onnxruntime, onnxsim - are
    # imported inside the functions that need them, so a tool that does not touch
    # them does not pay to import them and does not fail if they are absent.
    "PLC0415",
    # jaxtyping shape annotations are strings by design: Int8[Tensor, "c h w"] is
    # parsed by jaxtyping at runtime, not by Python's annotation grammar.
    "F722",
    # The vendored companding code uses the paper's Greek parameter names, and
    # the docstrings use the multiplication sign for image sizes. Both are
    # deliberate and both read better than their ASCII transliterations.
    "RUF001", "RUF002", "RUF003",
    # Several zips are intentionally truncating: a prefix walks fewer scale
    # groups than the schedule has. Blanket strict= would change behaviour.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Standalone tools put the repository root on sys.path before importing from it,
# so their library imports cannot come first. The alternative is a package
# install step for scripts that are meant to be runnable from a checkout.
"tools/*.py" = ["E402"]
# The vendored optimiser is kept byte-close to its upstream so it can be
# refreshed by re-copying; reformatting it would defeat that.
"src/compressors/frappe/third_party/*" = ["ALL"]
# The frozen paper scripts are reproduction artifacts, not maintained code.
"train_rae_progressive.py" = ["E501", "E741", "PLR0912", "PLR0915", "B023"]
"src/compressors/frappe/evaluate_encode_complexity.py" = ["B023"]
# model.py and quantize.py carry gigatorch's own one-line class docstrings
# verbatim so the vendored blocks can be refreshed by re-copying. Reflowing them
# would make that diff unreadable for no gain.
"src/compressors/frappe/model.py" = ["E501"]
"src/compressors/frappe/quantize.py" = ["E501"]
# Tests say what they mean at the cost of some repetition.
"tests/*" = ["ARG001", "PLR2004", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.rules]
# jaxtyping annotations are evaluated at runtime by beartype, not statically.
unresolved-attribute = "warn"
