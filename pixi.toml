[workspace]
authors = ["FRAPPE contributors"]
channels = ["conda-forge"]
description = "FRAPPE: Full-Input Residual-Output Autoencoding with Projection Pursuit Encoders"
name = "FRAPPE"
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
pillow = "*"
sympy = "*"
einops = "*"
matplotlib = "*"
jupyterlab = "*"
charls = ">=2.4.4,<3"

[activation.env]
# The repository root on the path, so `pixi run python ...` can import
# `src` and `tools` from anywhere without each script bootstrapping it.
PYTHONPATH = "."

[tasks]
train = "python train_rae_progressive.py"
train-managed = "python train_managed.py"
prepare-data = "python tools/prepare_rgb_dataset.py"
resize-data = "python tools/resize_rgb_dataset.py"
train-joint = "python train_joint_prefix.py"
evaluate-joint = "python tools/evaluate_joint_prefix.py"
prefix-ceiling = "python tools/analyze_prefix_ceiling.py"
prune-joint = "python tools/export_pruned_model.py"
export-onnx = "python tools/export_onnx.py"
sample-reconstructions = "python tools/export_reconstruction_samples.py"
roundtrip-openvino = "python tools/roundtrip_openvino.py"
benchmark-devices = "python tools/benchmark_openvino_devices.py"
quantize-encoder-int8 = "python tools/quantize_encoder_int8.py"
profile-encode-path = "python tools/profile_encode_path.py"
test = "pytest -q"
tensorboard = "tensorboard --logdir runs"
notebook = "jupyter lab FRAPPE.ipynb"

[pypi-dependencies]
torch = { version = ">=2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.22.0", index = "https://download.pytorch.org/whl/cu128" }
timm = "*"
datasets = "*"
huggingface_hub = "*"
safetensors = "*"
bjontegaard = "*"
pillow-jpls = "*"
livecodec = "*"
hydra-core = "*"
tensorboard = "*"
pytest = "*"
albumentations = "*"
onnx = "*"
onnxruntime = "*"
# The NPU / iGPU deployment path. 2025.1 is what the system packages provide
# and what the NPU plugin on Meteor Lake was verified against.
openvino = ">=2025.1"
onnxsim = "*"
onnxscript = "*"
beartype = "*"
jaxtyping = "*"
ruff = "*"
ty = "*"
radon = "*"
pytest-cov = "*"
